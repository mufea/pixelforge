# Render Blueprint for PixelForge AI.
# Does not deploy by itself. Create the Blueprint from the Render dashboard
# and fill the secret env group. Never commit real credentials.
#
# Production storage must be S3-compatible (R2, AWS S3, or hosted MinIO).
# Render disks are ephemeral and must not hold user assets.
#
# pixelforge-secrets is declared here so Blueprint validation can link it.
# Do not put secret values in this file. Render ignores sync: false inside
# env groups; leave secret keys valueless and fill them in the dashboard
# after the first sync. Re-sync keeps dashboard values for those keys.

services:
  - type: web
    name: pixelforge-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pixelforge-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: pixelforge-redis
          type: keyvalue
          property: connectionString
      - fromGroup: pixelforge-secrets

  - type: worker
    name: pixelforge-worker
    runtime: docker
    dockerfilePath: ./Dockerfile.worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pixelforge-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: pixelforge-redis
          type: keyvalue
          property: connectionString
      - fromGroup: pixelforge-secrets

  - type: keyvalue
    name: pixelforge-redis
    plan: starter
    ipAllowList: []

databases:
  - name: pixelforge-postgres
    plan: basic-256mb
    postgresMajorVersion: "16"

envVarGroups:
  - name: pixelforge-secrets
    envVars:
      - key: APP_URL
      - key: BETTER_AUTH_URL
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: S3_ENDPOINT
      - key: S3_BUCKET
      - key: S3_ACCESS_KEY_ID
      - key: S3_SECRET_ACCESS_KEY
      - key: S3_REGION
        value: us-east-1
      - key: S3_FORCE_PATH_STYLE
        value: "false"
      - key: FAL_KEY
      - key: STABILITY_API_KEY
      - key: OPENAI_API_KEY
      - key: AI_JOBS_ENABLED
        value: "false"
